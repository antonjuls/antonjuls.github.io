title: Anton Skrynnik
description: Software Engineer — React Native, Web, Mobile
url: "https://antonjuls.github.io"
baseurl: ""
og_image: /assets/images/avatar.png

markdown: kramdown
permalink: pretty

# Dot folders are skipped by default. .well-known holds the EarthRay app-link files
# (apple-app-site-association, assetlinks.json), served as plain static files.
include:
  - .well-known

collections:
  projects:
    output: true
    permalink: /projects/:title/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"
